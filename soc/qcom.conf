# ThermalGuard SoC path map: Qualcomm (Snapdragon)
# All paths are probed at runtime; missing nodes are skipped.

SOC_ID="qcom"
SOC_LABEL="Qualcomm Snapdragon"

# CPU frequency control
CPUFREQ_POLICY_GLOB="/sys/devices/system/cpu/cpufreq/policy*"
CPU_SCALING_MAX_FREQ="scaling_max_freq"
CPU_SCALING_MIN_FREQ="scaling_min_freq"
CPU_SCALING_GOVERNOR="scaling_governor"
CPU_BOOST="boost"

# Thermal zone type keywords (case-insensitive substring match)
# Samsung A05s (SM6225) example zones:
#   cpu-1-0..3, cpuss-0..2  → CPU
#   gpu                     → GPU
#   quiet-therm             → skin (runs hot; zone ref prefers battery)
#   battery / bms           → battery
THERMAL_TYPE_CPU="cpu|tsens|cluster|core|cpuss|soc|msoc"
THERMAL_TYPE_GPU="gpu|adreno|mali|kgsl"
THERMAL_TYPE_BATT="battery|batt"
THERMAL_TYPE_SKIN="skin|quiet|case|back|pa_therm|shell|wifi"

# Battery via power_supply
BATTERY_TEMP_NODE="/sys/class/power_supply/battery/temp"

# GPU frequency (Adreno via kgsl)
GPU_FREQ_GLOB="/sys/class/kgsl/kgsl-3d0"
GPU_FREQ_MAX_NODE="max_gpuclk"
GPU_DEVFREQ_GLOB="/sys/class/devfreq/*gpu*"
GPU_DEVFREQ_MAX="max_freq"
GPU_DEVFREQ_GOV="governor"

# Charging current control
CHARGE_CURRENT_GLOB="/sys/class/power_supply/*battery*"
CHARGE_CURRENT_NODE="constant_charge_current_max"
CHARGE_CURRENT_UA_NODE="constant_charge_current"

# Background process limits
CPUSET_BG_GLOB="/dev/cpuset/*/cpus"
UCLAMP_BG_GLOB="/proc/sys/kernel/sched_util_clamp_min"

# Thermal threshold overrides (sysfs write targets)
THERMAL_TRIP_GLOB="/sys/class/thermal/thermal_zone*/trip_point_*_temp"
